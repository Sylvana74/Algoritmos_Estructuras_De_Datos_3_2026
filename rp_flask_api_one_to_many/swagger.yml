openapi: 3.0.0
info:
  title: API Biblioteca REST
  description: API REST para administrar Autores y Libros
  version: "1.0.0"

servers:
  - url: "/api"

components:
  schemas:
    Author:
      type: object
      required:
        - lname
      properties:
        fname:
          type: string
        lname:
          type: string
    Book:
      type: object
      required:
        - author_id
        - title
      properties:
        author_id:
          type: integer
        title:
          type: string
  parameters:
    lname:
      name: lname
      in: path
      required: true
      schema:
        type: string
    book_id:
      name: book_id
      in: path
      required: true
      schema:
        type: integer

paths:
  /authors:
    get:
      operationId: authors.read_all
      tags:
        - Authors
      summary: Obtener todos los autores y sus libros
      responses:
        "200":
          description: Lista de autores
    post:
      operationId: authors.create
      tags:
        - Authors
      summary: Crear un nuevo autor
      requestBody:
        description: Datos del autor
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Author"
      responses:
        "201":
          description: Autor creado

  /authors/{lname}:
    get:
      operationId: authors.read_one
      tags:
        - Authors
      summary: Obtener un autor por su apellido
      parameters:
        - $ref: "#/components/parameters/lname"
      responses:
        "200":
          description: Autor encontrado
    put:
      operationId: authors.update
      tags:
        - Authors
      summary: Actualizar un autor
      parameters:
        - $ref: "#/components/parameters/lname"
      requestBody:
        description: Nuevos datos
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Author"
      responses:
        "201":
          description: Autor actualizado
    delete:
      operationId: authors.delete
      tags:
        - Authors
      summary: Eliminar un autor
      parameters:
        - $ref: "#/components/parameters/lname"
      responses:
        "200":
          description: Autor eliminado

  /books:
    post:
      operationId: books.create
      tags:
        - Books
      summary: Crear un libro para un autor
      requestBody:
        description: Datos del libro
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Book"
      responses:
        "201":
          description: Libro creado

  /books/{book_id}:
    get:
      operationId: books.read_one
      tags:
        - Books
      summary: Obtener un libro por ID
      parameters:
        - $ref: "#/components/parameters/book_id"
      responses:
        "200":
          description: Libro encontrado
    put:
      operationId: books.update
      tags:
        - Books
      summary: Actualizar un libro
      parameters:
        - $ref: "#/components/parameters/book_id"
      requestBody:
        description: Datos del libro
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Book"
      responses:
        "201":
          description: Libro actualizado
    delete:
      operationId: books.delete
      tags:
        - Books
      summary: Eliminar un libro
      parameters:
        - $ref: "#/components/parameters/book_id"
      responses:
        "200":
          description: Libro eliminado