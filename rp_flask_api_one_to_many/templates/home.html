<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Autores y Libros</title>
</head>
<body>
    <h1>Catálogo de Autores y sus Libros</h1>
    {% for author in authors %}
        <h2>{{ author.fname }} {{ author.lname }}</h2>
        <ul>
            {% for book in author.books %}
                <li><strong>{{ book.title }}</strong></li>
            {% else %}
                <li><em>Sin libros registrados</em></li>
            {% endfor %}
        </ul>
    {% endfor %}
</body>
</html>
